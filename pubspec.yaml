name: stash_app
description: Stashh — your AI second brain for saved videos & links
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  receive_sharing_intent: ^1.8.0
  http: ^1.2.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.4
  uuid: ^4.3.3
  timeago: ^3.6.1
  provider: ^6.1.2
  go_router: ^13.2.0
  shared_preferences: ^2.2.3
  smooth_page_indicator: ^1.1.0
  video_thumbnail_plus: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
